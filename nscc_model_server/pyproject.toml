[project]
name = "nscc-model-server"
version = "0.1.0"
description = "vLLM server for the NSCC H100 node -- separate from ../local-model-server/ on purpose, see README.md."
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
